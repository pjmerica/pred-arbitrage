name: Validate model reviewer

# Manual only. Scores tools/llm_review.py against the 93 market families a
# person reviewed (tests/data/reviewed_families.json) and commits the result
# to data/llm_review_validation.json. Auto mode (repo variable
# LLM_REVIEW_MODE=auto) is refused unless this shows ZERO rejected families
# approved. ~93 requests (~$3 at Opus 5.5 prices). Added 2026-10-12.

on:
  workflow_dispatch:

concurrency:
  group: pred-arb-data
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate against the hand-reviewed families
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python tools/llm_review.py --validate
      - name: Commit the validation record
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/llm_review_validation.json
          git diff --cached --quiet && exit 0
          git commit -m "llm review validation: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git push && exit 0; git pull --rebase origin master || { git rebase --abort; exit 1; }; done
          exit 1
