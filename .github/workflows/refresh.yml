name: Daily refresh

on:
  schedule:
    # Two refreshes/day, offset 30 min from polling-agg so we don't hammer
    # Polymarket/Kalshi at the same instant.
    # Off the busy :00/:30 minutes (2026-10-11): GitHub ran the :30 slots
    # ~6 h late. reprice.yml's watchdog dispatches this if it's >14 h stale.
    - cron: '7 12 * * *'    # ~08:07 ET (morning)
    - cron: '7 0 * * *'     # ~20:07 ET (evening)
  workflow_dispatch:

# Full refresh and the 2-hourly re-price (reprice.yml) share one queue so
# they never race each other's commit.
concurrency:
  group: pred-arb-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write           # tools/health.py keeps one "Board health" issue in sync
    steps:
      # Latest master, not the commit the run was triggered on (2026-10-12):
      # a queued refresh pinned to an old SHA conflicted with the hourly
      # re-price and its whole result was discarded.
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # Rules-text + Kalshi event->series caches survive between runs
      # (2026-10-11): a fresh checkout re-fetched ~300 rules texts and ~400
      # events every hour and Kalshi rate-limited the runner (35 soccer
      # families unchecked, 76 links unresolved). Restore the newest copy,
      # save an updated one under a new key.
      - name: Restore rules / series caches
        uses: actions/cache@v4
        with:
          path: |
            data/processed/scrutiny_cache.json
            data/processed/kalshi_series_cache.json
          key: pred-arb-rules-${{ github.run_id }}
          restore-keys: pred-arb-rules-

      - run: pip install -r requirements.txt pytest

      # Regression cases for past fake-arb incidents. If a code change
      # reintroduces one, fail here — before the pipeline can publish.
      - name: Matching regression tests
        run: python -m pytest tests -q

      - name: Run full pipeline
        run: python -u run_all.py

      # Model-assisted review of new market families (2026-10-12,
      # tools/llm_review.py). No ANTHROPIC_API_KEY secret = no-op. Drafts go
      # into the Board health issue; with repo variable LLM_REVIEW_MODE=auto
      # verdicts are written into data/series_map.json, which the tool
      # refuses unless the committed validation run approved zero rejected
      # families. New approvals apply from the next re-price.
      - name: Model review of new market families
        continue-on-error: true
        timeout-minutes: 10
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python tools/llm_review.py ${{ vars.LLM_REVIEW_MODE == 'auto' && '--apply' || '' }}

      # Link check (2026-10-10): rebuild every leg's URL from the platform
      # API by the ID we priced and repair any that differ, before the
      # smoke test and commit. A platform changing its URL scheme then
      # fixes itself instead of shipping links to the wrong prop.
      - name: Verify and repair market links
        continue-on-error: true
        timeout-minutes: 4       # never let link checking block the publish (2026-10-11)
        run: python tools/linkcheck.py --fix --pages --summary "$GITHUB_STEP_SUMMARY"

      # Run the dashboard's JS against the freshly generated data in a DOM
      # stub; if the page would throw, fail BEFORE committing so the live
      # site keeps its last good snapshot.
      - name: Dashboard smoke test
        run: node tools/dash_smoke.js docs tools/dash_exercise.js

      # Independent re-check (2026-09-26): re-fetch both books and fees for
      # every guaranteed basket and write the table to the job summary.
      # Report only; prices move between the scan and this step.
      - name: Live re-check of guaranteed baskets
        continue-on-error: true
        timeout-minutes: 4
        run: python tools/livecheck.py --summary "$GITHUB_STEP_SUMMARY"

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Explicit list of artifacts the cron is allowed to push back.
          # Anything else in data/ or docs/ stays untouched even if it's
          # been modified by the pipeline. The full Kalshi/Polymarket scrapes
          # are gitignored (2026-09-26); data/reprice/ carries the matched
          # rows the 2-hourly re-price needs. The explicit list
          # here means a future "wrote junk under data/" wouldn't
          # accidentally ship.
          git add \
            data/reprice/kalshi_markets.csv \
            data/reprice/polymarket_markets.csv \
            data/raw/predictit_markets.csv \
            data/raw/orderbook_depth.csv \
            data/processed/house_incumbents.json \
            data/processed/election_pairs.csv \
            data/processed/series_review.csv \
            data/processed/matched_pairs.csv \
            data/series_map.json \
            data/template_refs.json \
            docs/arb_data.js
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "data refresh: $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do
              if git push; then exit 0; fi
              echo "Push rejected, rebasing on origin/master (attempt $i)…"
              if ! git pull --rebase origin master; then
                # A re-price committed the same generated files during this
                # run. The full refresh is newer and carries the new pair
                # list, so it WINS on its own files (2026-10-12: the old
                # "skip" rule discarded a whole full refresh). Code / config
                # conflicts can't happen here (the commit only holds
                # generated files plus series_map.json), but if anything
                # else is left unresolved, abort and fail loudly.
                CONFLICTED=$(git diff --name-only --diff-filter=U)
                echo "Rebase conflict on: $CONFLICTED — keeping this full refresh's versions"
                echo "$CONFLICTED" | xargs -r git checkout --theirs --
                echo "$CONFLICTED" | xargs -r git add --
                if ! GIT_EDITOR=true git rebase --continue; then
                  git rebase --abort
                  echo "::error::could not rebase the full refresh onto master"; exit 1
                fi
              fi
            done
            echo "Push failed after 3 attempts"; exit 1
          fi

      # Board health (2026-10-11): one GitHub issue listing what needs a
      # human (unreviewed families, lapsing approvals, repaired links, stale
      # data, held-back baskets). Opened when something appears (that's the
      # notification), edited while it persists, closed when it clears.
      # Runs even if an earlier step failed.
      - name: Board health issue
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/health.py --issue --summary "$GITHUB_STEP_SUMMARY"
