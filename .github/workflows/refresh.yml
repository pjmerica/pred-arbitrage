name: Daily refresh

on:
  schedule:
    # Two refreshes/day, offset 30 min from polling-agg so we don't hammer
    # Polymarket/Kalshi at the same instant.
    - cron: '30 12 * * *'   # 08:30 ET (morning)
    - cron: '30 0 * * *'    # 20:30 ET (evening)
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run full pipeline
        run: python -u run_all.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Explicit list of artifacts the cron is allowed to push back.
          # Anything else in data/ or docs/ stays untouched even if it's
          # been modified by the pipeline. .gitignore already restricts
          # data/raw/ to the four scraper CSVs, but the explicit list
          # here means a future "wrote junk under data/" wouldn't
          # accidentally ship.
          git add \
            data/raw/kalshi_markets.csv \
            data/raw/polymarket_markets.csv \
            data/raw/predictit_markets.csv \
            data/raw/orderbook_depth.csv \
            data/processed/house_incumbents.json \
            data/processed/election_pairs.csv \
            docs/arb_data.js
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "data refresh: $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do
              if git push; then break; fi
              echo "Push rejected, rebasing on origin/master (attempt $i)…"
              git pull --rebase origin master
            done
          fi
