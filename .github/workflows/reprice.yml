name: Re-price (hourly)

# Fast loop between the twice-daily full refreshes (refresh.yml). Keeps the
# last full run's matched pairs and re-fetches ONLY their order books
# (~800 markets, ~1,200 requests, ~6 min — fetched one at a time to stay under Kalshi's ~20 req/s) plus PredictIt's quotes
# (1 request), then recomputes the board. Real arbs open and close within
# minutes-to-hours; the full scrape re-prices all ~31k Polymarket markets
# (~32,700 requests) and only runs twice a day.
#
# Load: hourly (2026-10-11) ~= 24 runs/day x ~1,200 requests ~= 29k/day,
# well inside Polymarket's 1,500 req/10s /book limit (throttles, doesn't
# ban) and Kalshi's ~20 req/s basic read tier. GitHub's cron is
# best-effort and skipped about 2/3 of the old 2-hourly runs, so a denser
# schedule at an off-peak minute (:17) keeps the board within ~1-2 h. The
# shared concurrency group keeps runs from overlapping.

on:
  schedule:
    - cron: '17 * * * *'      # hourly at an off-peak minute (2026-10-11): GitHub skipped ~2/3 of the 2-hourly runs
  workflow_dispatch:
    inputs:
      health_test:
        description: "Add a test alert so the Board health issue opens (next normal run closes it)"
        type: boolean
        default: false

concurrency:
  group: pred-arb-data        # shared with refresh.yml: queue, never race
  cancel-in-progress: false

jobs:
  reprice:
    runs-on: ubuntu-latest
    timeout-minutes: 30      # re-price ~8 min on the keyset universe + checks (2026-10-11)
    permissions:
      contents: write
      issues: write           # tools/health.py keeps one "Board health" issue in sync
      actions: write          # lets the watchdog below dispatch refresh.yml
    steps:
      # A queued run is pinned to the commit that existed when it was
      # TRIGGERED; check out the latest master instead so a re-price queued
      # behind a full refresh uses that refresh's matched_pairs.csv.
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # Watchdog (2026-09-26): GitHub's cron is best-effort — on 2026-09-25
      # the 12:30 full refresh started at 17:24 and the 00:30 one hadn't
      # started by 01:15. If the last full scrape is >14h old, dispatch
      # refresh.yml; it queues behind this run (shared concurrency group).
      - name: Full-refresh watchdog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AGE=$(python -c "import json,datetime as d;s=open('docs/arb_data.js').read();j=json.loads(s[s.index('{'):s.rindex('}')+1]);t=d.datetime.fromisoformat(j['markets_scraped_at']);print(int((d.datetime.now(d.timezone.utc)-t).total_seconds()//3600))" 2>/dev/null || echo 99)
          echo "Last full scrape: ${AGE}h ago"
          if [ "$AGE" -ge 14 ]; then
            echo "Full refresh overdue; dispatching refresh.yml"
            gh workflow run refresh.yml --ref master || echo "::warning::could not dispatch refresh.yml"
          fi

      # Rules-text + Kalshi event->series caches survive between runs
      # (2026-10-11): a fresh checkout re-fetched ~300 rules texts and ~400
      # events every hour and Kalshi rate-limited the runner (35 soccer
      # families unchecked, 76 links unresolved). Restore the newest copy,
      # save an updated one under a new key.
      - name: Restore rules / series caches
        uses: actions/cache@v4
        with:
          path: |
            data/processed/scrutiny_cache.json
            data/processed/kalshi_series_cache.json
          key: pred-arb-rules-${{ github.run_id }}
          restore-keys: pred-arb-rules-

      - run: pip install -r requirements.txt pytest

      - name: Matching regression tests
        run: python -m pytest tests -q

      # Needs data/processed/matched_pairs.csv from the last full refresh
      # (tracked). The scanner's freshness guard allows the full-scrape
      # CSVs up to 26h in this mode: if full refreshes stop for a day,
      # re-pricing stops too rather than pricing a stale universe.
      - name: Re-price matched pairs
        run: python -u run_all.py --reprice

      # Link check (2026-10-10): rebuild every leg's URL from the platform
      # API by the ID we priced and repair any that differ, before the
      # smoke test and commit. A platform changing its URL scheme then
      # fixes itself instead of shipping links to the wrong prop.
      - name: Verify and repair market links
        continue-on-error: true
        timeout-minutes: 4       # never let link checking block the publish (2026-10-11)
        run: python tools/linkcheck.py --fix --pages --summary "$GITHUB_STEP_SUMMARY"

      - name: Dashboard smoke test
        run: node tools/dash_smoke.js docs tools/dash_exercise.js

      # Independent re-check (2026-09-26): re-fetch both books and fees for
      # every guaranteed basket and write the table to the job summary.
      # Report only; prices move between the scan and this step.
      - name: Live re-check of guaranteed baskets
        continue-on-error: true
        timeout-minutes: 4
        run: python tools/livecheck.py --summary "$GITHUB_STEP_SUMMARY"

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/raw/predictit_markets.csv \
            data/raw/orderbook_depth.csv \
            data/processed/series_review.csv \
            docs/arb_data.js
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "reprice: $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do
              if git push; then exit 0; fi
              echo "Push rejected, rebasing on origin/master (attempt $i)…"
              if ! git pull --rebase origin master; then
                # A newer run already committed these generated files. Its
                # data is at least as fresh as ours: abort cleanly, skip.
                git rebase --abort
                echo "Newer data landed on master during this run; skipping this push."
                exit 0
              fi
            done
            echo "Push failed after 3 attempts"; exit 1
          fi

      # Board health (2026-10-11): one GitHub issue listing what needs a
      # human (unreviewed families, lapsing approvals, repaired links, stale
      # data, held-back baskets). Opened when something appears (that's the
      # notification), edited while it persists, closed when it clears.
      # Runs even if an earlier step failed.
      - name: Board health issue
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/health.py --issue --summary "$GITHUB_STEP_SUMMARY" ${{ inputs.health_test && '--test-alert' || '' }}
